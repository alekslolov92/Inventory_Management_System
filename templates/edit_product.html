{% extends "base.html" %}
{% block title %}Edit Product - InvenTrack{% endblock %}
{% block page_title %}Edit Product{% endblock %}

{% block content %}
<div class="form-container">
    <div class="card">
        <div class="card-header">
            <h2><i class="fas fa-pen"></i> Edit: {{ product.name }}</h2>
        </div>
        <form method="POST" action="{{ url_for('edit_product', product_id=product.id) }}">
            <div class="form-grid">
                <div class="form-group">
                    <label for="name">Product Name <span class="required">*</span></label>
                    <input type="text" id="name" name="name" class="form-control" value="{{ product.name }}" required>
                </div>
                <div class="form-group">
                    <label for="category_id">Category</label>
                    <select id="category_id" name="category_id" class="form-control">
                        <option value="">— Select Category —</option>
                        {% for cat in categories %}
                        <option value="{{ cat.id }}" {{ 'selected' if cat.id == product.category_id }}>{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="price">Price (₹) <span class="required">*</span></label>
                    <input type="number" id="price" name="price" class="form-control" value="{{ product.price }}" step="0.01" min="0" required>
                </div>
                <div class="form-group">
                    <label for="stock_quantity">Stock Quantity <span class="required">*</span></label>
                    <input type="number" id="stock_quantity" name="stock_quantity" class="form-control" value="{{ product.stock_quantity }}" min="0" required>
                </div>
                <div class="form-group">
                    <label for="low_stock_threshold">Low Stock Alert Threshold</label>
                    <input type="number" id="low_stock_threshold" name="low_stock_threshold" class="form-control" value="{{ product.low_stock_threshold }}" min="0">
                </div>
            </div>
            <div class="form-actions">
                <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Update Product
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
